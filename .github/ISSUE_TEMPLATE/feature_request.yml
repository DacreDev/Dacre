name: Feature request
description: Suggest something Dacre should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. Screenshots or examples from other tools help.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
